<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cartão · {{ musica.titulo }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
@page{size:A6 landscape;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#F2F1EF;font-family:Figtree,system-ui,sans-serif;color:#1C1917;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px}
.cartao{width:148mm;height:105mm;max-width:100%;background:#fff;border-radius:6mm;box-shadow:0 20px 50px -25px rgba(28,25,23,.45);display:grid;grid-template-columns:1fr 46mm;gap:8mm;padding:10mm;position:relative;overflow:hidden}
.cartao::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4mm;background:#E11D48}
.texto{display:flex;flex-direction:column;justify-content:space-between}
.para{font-size:11pt;color:#57534E;margin:0}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20pt;line-height:1.05;letter-spacing:-.02em;margin:3mm 0 0}
.de{font-size:11pt;margin:0}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm;text-align:center}
.qr svg{width:42mm;height:42mm}
.qr span{font-size:8.5pt;color:#57534E;line-height:1.3}
.acoes{display:flex;gap:10px}
button{font:600 16px Figtree,sans-serif;border:0;border-radius:999px;padding:14px 26px;background:#E11D48;color:#fff;cursor:pointer}
@media print{ body{background:#fff;padding:0} .cartao{box-shadow:none;border-radius:0;width:148mm;height:105mm} .acoes{display:none} }
</style>
</head>
<body>
<div class="acoes"><button onclick="print()">Imprimir ou salvar em PDF</button></div>
<div class="cartao">
  <div class="texto">
    <div>
      <p class="para">Uma música feita só para {{ para }}</p>
      <h1>{{ musica.titulo }}</h1>
    </div>
    <p class="de">Com carinho, {{ musica.respostas.de }}</p>
  </div>
  <div class="qr">{{ qr|safe }}<span>Aponte a câmera do celular para ouvir</span></div>
</div>
</body>
</html>
